name: ERPBack checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U erp -d erp_test' --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://erp:ci-only-password@localhost:5432/erp_test
      TEST_DATABASE_URL: postgresql://erp:ci-only-password@localhost:5432/erp_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:integration
